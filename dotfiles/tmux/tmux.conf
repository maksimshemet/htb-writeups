# ~/.tmux.conf — pentest / OSCP practice setup
# Pairs with log-pane.sh for automatic per-pane session logging.
# See README.md in this folder for install + how the logging works.

# ── Prefix ───────────────────────────────────────────────────────────────────
# Alt-a instead of the default Ctrl-b (no Ctrl reach, no readline conflict).
# Everything below is still "prefix then key" — i.e. Alt-a, release, then the key.
# Press Alt-a twice to send a literal Alt-a to the shell.
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# ── General ──────────────────────────────────────────────────────────────────
set -g mouse on                       # click panes, drag borders, scroll with the wheel
set -g history-limit 100000           # big scrollback for long scans
set -g base-index 1                   # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on            # keep window numbers gap-free
setw -g mode-keys vi                  # vi keys in copy mode

# ── Splits / new windows open in the current directory ───────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Automatic per-pane logging + archive-on-close ────────────────────────────
# Requires ~/.tmux/tmux-log.sh (chmod +x) and moreutils (`ts`). Each session logs
# to its own dir under ~/pentest-logs; on close it's tar.gz'd and the raw dir
# removed. Hooks fire only for panes created AFTER this loads → start fresh.
#   start  = sweep stale dirs (archives the previous run's last session) + log pane
#   pane   = log a new window/split
#   close  = archive + remove a session's dir (fires for every session EXCEPT the
#            last one, since the server exits first — the next 'start' sweep catches it)
set-hook -g session-created    "run-shell \"~/.tmux/tmux-log.sh start '#{session_id}' '#{pane_id}'\""
set-hook -g after-new-window   "run-shell \"~/.tmux/tmux-log.sh pane  '#{session_id}' '#{pane_id}'\""
set-hook -g after-split-window "run-shell \"~/.tmux/tmux-log.sh pane  '#{session_id}' '#{pane_id}'\""
set-hook -g session-closed     "run-shell -b \"~/.tmux/tmux-log.sh close '#{hook_session}'\""

# End the box now: flush + archive this session's logs, then kill it (works even
# as the only/last session). prefix + E
bind E confirm-before -p "archive logs and kill this session? (y/n)" \
  "run-shell \"~/.tmux/tmux-log.sh endkill '#{session_id}'\""

# ── Copy to the system clipboard ─────────────────────────────────────────────
# Kali / X11: needs xclip (`sudo apt install xclip`). On a Wayland desktop swap
# `xclip -selection clipboard -in` for `wl-copy`. Or hold Shift while dragging to
# use the terminal's own selection instead of tmux's.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
# Keyboard: prefix [ → v to select → y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'   # manual on-demand logging (prefix Shift-P)
set -g @logging-path "$HOME/pentest-logs"
run '~/.tmux/plugins/tpm/tpm'         # keep this line LAST
